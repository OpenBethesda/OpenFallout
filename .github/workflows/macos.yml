name: Reusable MacOS workflow

on:
  workflow_call:
    inputs:
      build-type:
        default: RelWithDebInfo
        type: string
      signing-environment:
        description: >-
          GitHub environment that holds the release signing secrets (docs/openfallout/mac-release.md). Callers name it
          only for a tag or the default branch; empty means the job has no environment and can only make the ad hoc
          build.
        default: ""
        type: string
      bundle-angle:
        description: >-
          The early notarized test of ANGLE (docs/openfallout/angle.md): download the published ANGLE asset, package
          its libraries and the ANGLE probe into the OpenGL app and check them. Never for a release.
        default: false
        type: boolean
    # Release signing (CI/macos/release_signing.py, docs/openfallout/mac-release.md). All optional: without them, and
    # on pull requests, the package is the ad hoc build and notarization is skipped.
    secrets:
      MACOS_DEVELOPER_ID_P12_BASE64:
        required: false
      MACOS_DEVELOPER_ID_P12_PASSWORD:
        required: false
      MACOS_TEAM_ID:
        required: false
      MACOS_NOTARY_API_KEY:
        required: false
      MACOS_NOTARY_API_KEY_ID:
        required: false
      MACOS_NOTARY_API_ISSUER_ID:
        required: false
      # Coverage and test-result uploads (docs/openfallout/ci-reporting.md).
      CODECOV_TOKEN:
        required: false

jobs:
  # The packaged app: the OpenGL build, its signing, packaging, notarization and checks, and the release. The unit tests, the
  # Metal build and the Python tests are jobs of their own below, so that none of them waits for the app (or the app for
  # them) and each has a compiler cache of its own: the three trees are built with different flags and share no objects.
  MacOS:
    # A fixed name: the check is "macOS / Build, test and package" (CI/harness_release.py MAC_JOB).
    name: Build, test and package
    # The one runner image: Apple Silicon, macOS 26. The cache keys below spell it out.
    runs-on: macos-26
    # Time budget: a cold compiler cache took 34.9 min (20 Nov 2026), a warm one 6.4 min; release runs add notarization.
    timeout-minutes: 60
    # The environment's own rules (which branches and tags may use it, who must approve) decide whether this job gets
    # the signing secrets; a tag or branch outside those rules cannot read them whatever its copy of the scripts says.
    environment: ${{ inputs.signing-environment }}
    env:
      CMAKE_BUILD_TYPE: ${{ inputs.build-type }}
      # ANGLE (CI/angle_asset.py fetch) lives in one folder, named here once. It is only needed here by the manual ANGLE
      # test run (bundle-angle); the Metal job fetches its own copy into the same name. This is the default of
      # CI/before_script.macos.sh; the steps below pass it anyway.
      ANGLE_ROOT_PATH: /tmp/openfallout-angle
    steps:
    - uses: actions/checkout@v7

    # Each job decides for itself whether the change needs it, so that no Mac job waits for another job. A documentation-only
    # change skips every step after this one (CI/changed_paths.py; the job itself still reports green). It fails closed: a
    # problem in it means "build". A release tag always builds: the step is skipped there and its empty output reads as
    # "build".
    - name: Decide whether the Mac build is needed
      id: classify
      if: ${{ inputs.build-type != 'Release' }}
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: python3 CI/changed_paths.py --event "$EVENT" --base "$BASE" --github-output "$GITHUB_OUTPUT"

    - name: Set up the Mac build
      id: setup
      if: ${{ steps.classify.outputs.code != 'false' }}
      uses: ./.github/actions/mac-build-setup

    - name: Prime ccache
      id: compiler-cache
      if: ${{ steps.classify.outputs.code != 'false' }}
      uses: hendrikmuhs/ccache-action@v1.2.25
      with:
        install: 'no'
        key: macos-26-app-${{ inputs.build-type }}
        max-size: 1000M
        # Only master and release builds store caches, so that pull request runs
        # do not push the caches pull requests start from out of the 10 GB budget.
        save: ${{ inputs.build-type == 'Release' || github.ref == 'refs/heads/master' }}

    - name: Fingerprint build environment
      id: build-env
      if: ${{ steps.classify.outputs.code != 'false' }}
      run: |
        echo "key=$(python3 CI/build_cache.py key --compiler clang --mode 'macos-26-${{ inputs.build-type }}' --dependency-file "${{ steps.setup.outputs.manifest-path }}")" >> "$GITHUB_OUTPUT"

    - name: Restore incremental build
      id: build-cache
      if: ${{ steps.classify.outputs.code != 'false' }}
      uses: actions/cache/restore@v6
      with:
        path: |
          build/*
          !build/*.dmg
          !build/_CPack_Packages
        key: build-macos-v1-${{ steps.build-env.outputs.key }}-${{ github.sha }}
        restore-keys: build-macos-v1-${{ steps.build-env.outputs.key }}-

    - name: Restore unchanged source timestamps
      if: ${{ steps.classify.outputs.code != 'false' }}
      run: python3 CI/build_cache.py restore

    # The ANGLE release asset named in CI/macos/angle/angle.json, verified against its recorded digests; never built
    # here. Only the manual ANGLE test run needs it in this job (it packages the libraries).
    - name: Fetch the ANGLE libraries
      if: ${{ steps.classify.outputs.code != 'false' && inputs.bundle-angle }}
      run: python3 CI/angle_asset.py fetch "$ANGLE_ROOT_PATH"

    - name: Configure
      if: ${{ steps.classify.outputs.code != 'false' }}
      env:
        BUNDLE_ANGLE: ${{ inputs.bundle-angle && 'yes' || '' }}
      run: CI/before_script.macos.sh -C -k ${BUNDLE_ANGLE:+-A "$ANGLE_ROOT_PATH"}
    - name: Build
      id: build
      if: ${{ steps.classify.outputs.code != 'false' }}
      run: CI/macos/build.sh all

    - name: Record source timestamps
      if: ${{ steps.classify.outputs.code != 'false' }}
      run: python3 CI/build_cache.py snapshot

    - name: Save incremental build
      if: ${{ steps.classify.outputs.code != 'false' && steps.build-cache.outputs.cache-hit != 'true' && !inputs.bundle-angle && (inputs.build-type == 'Release' || github.ref == 'refs/heads/master') }}
      uses: actions/cache/save@v6
      with:
        path: |
          build/*
          !build/*.dmg
          !build/_CPack_Packages
        key: ${{ steps.build-cache.outputs.cache-primary-key }}

    # The core (records, scripts, world, rules) stays plain C++: no Apple header, macro or AppKit name outside the
    # edge list (docs/openfallout/core-and-edges.md).
    - name: Check that the core has no Apple code
      if: ${{ steps.classify.outputs.code != 'false' }}
      run: python3 CI/check_core_edges.py

    # Tags and the default branch with the signing secrets: import the Developer ID identity into a temporary keychain
    # and hand it to the packaging step (OPENFALLOUT_CODESIGN_IDENTITY / _TEAM_ID through GITHUB_ENV). Anything else:
    # "ad hoc build, notarization skipped".
    - name: Release signing
      id: signing
      if: ${{ steps.classify.outputs.code != 'false' }}
      env:
        OPENFALLOUT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        MACOS_DEVELOPER_ID_P12_BASE64: ${{ github.event_name != 'pull_request' && secrets.MACOS_DEVELOPER_ID_P12_BASE64 || '' }}
        MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MACOS_DEVELOPER_ID_P12_PASSWORD || '' }}
        MACOS_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.MACOS_TEAM_ID || '' }}
        MACOS_NOTARY_API_KEY: ${{ github.event_name != 'pull_request' && secrets.MACOS_NOTARY_API_KEY || '' }}
        MACOS_NOTARY_API_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.MACOS_NOTARY_API_KEY_ID || '' }}
        MACOS_NOTARY_API_ISSUER_ID: ${{ github.event_name != 'pull_request' && secrets.MACOS_NOTARY_API_ISSUER_ID || '' }}
      run: python3 CI/macos/release_signing.py setup

    - name: Package disk image
      if: ${{ steps.classify.outputs.code != 'false' }}
      run: |
        for attempt in 1 2 3; do
          if CI/macos/build.sh package > "$RUNNER_TEMP/package.log" 2>&1; then
            cat "$RUNNER_TEMP/package.log"
            exit 0
          fi
          cat "$RUNNER_TEMP/package.log"
          if ! grep -q 'hdiutil: create failed - Resource busy' "$RUNNER_TEMP/package.log" || [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          echo "Disk-image creation is busy; retrying in 10 seconds ($attempt/3)"
          sleep 10
        done

    - name: Notarize and staple
      if: ${{ steps.classify.outputs.code != 'false' && steps.signing.outputs.mode == 'release' }}
      env:
        MACOS_NOTARY_API_KEY: ${{ github.event_name != 'pull_request' && secrets.MACOS_NOTARY_API_KEY || '' }}
        MACOS_NOTARY_API_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.MACOS_NOTARY_API_KEY_ID || '' }}
        MACOS_NOTARY_API_ISSUER_ID: ${{ github.event_name != 'pull_request' && secrets.MACOS_NOTARY_API_ISSUER_ID || '' }}
      run: |
        set -- build/OpenFallout-*.dmg
        python3 CI/macos/release_signing.py notarize "$1"

    # Always: setup can fail before it sets its output; cleanup does nothing when this job made no keychain (a
    # documentation-only run made none)
    - name: Remove the signing keychain
      if: ${{ always() }}
      run: python3 CI/macos/release_signing.py cleanup

    # Release mode on the notarized build (Developer ID on every binary, Gatekeeper, stapled tickets); local mode on the
    # ad hoc one (Gatekeeper is not asked). The smoke step starts the game from the disk image with a hidden window; a
    # runner that gives it no OpenGL context, or whose software renderer is too slow for the run to end in time, reports
    # it as skipped; a crash or an engine that does not quit peacefully fails the job. Before a release the smoke step
    # is run on the development Mac on the draft release's image (`--smoke run`). The check appends the release-notes
    # line (renderer, SHA-256, macOS version and chip). The build makes exactly one disk image, for Apple Silicon.
    - name: Check the packaged app
      if: ${{ steps.classify.outputs.code != 'false' }}
      env:
        CHECK_MODE: ${{ steps.signing.outputs.mode == 'release' && 'release' || 'local' }}
        ANGLE_CHECK: ${{ inputs.bundle-angle && 'bundled' || 'none' }}
      run: |
        set -- build/OpenFallout-*.dmg
        if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
          echo "FAIL dmg: expected exactly one disk image in build/, found: $*"
          exit 1
        fi
        python3 CI/check_mac_package.py "$1" --mode "$CHECK_MODE" --smoke auto --work "$RUNNER_TEMP/package-check" \
          --notes "$RUNNER_TEMP/release-notes.md" --angle "$ANGLE_CHECK"

    # The engine release (docs/openfallout/engine-release.md), on an `openfallout-*` tag build. The statement the shell reads is written from the checked
    # disk image; the job fails when the statement, the property lists, the CMake version, the tag and the binaries
    # disagree. The "Supported" line joins the release notes. The "Played on" line is the owner's, added to the draft
    # before publishing; the release gate asks for it.
    - name: Test the engine-release tooling
      if: ${{ steps.classify.outputs.code != 'false' && inputs.build-type == 'Release' && startsWith(github.ref_name, 'openfallout-') }}
      run: python3 -m unittest discover -s CI -p test_engine_release.py -v

    - name: Write the engine-release statement
      if: ${{ steps.classify.outputs.code != 'false' && inputs.build-type == 'Release' && startsWith(github.ref_name, 'openfallout-') }}
      run: |
        set -- build/OpenFallout-*.dmg
        python3 CI/engine_release.py write "$1" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
          --out "$RUNNER_TEMP/openfallout-engine-release.json"
        python3 CI/engine_release.py notes "$RUNNER_TEMP/openfallout-engine-release.json" \
          --append "$RUNNER_TEMP/release-notes.md"

    - name: Store the packaged-app check logs
      if: ${{ always() && steps.classify.outputs.code != 'false' }}
      uses: actions/upload-artifact@v7
      with:
        name: openfallout-macos-package-check-arm64-${{ github.sha }}
        path: |
          ${{ runner.temp }}/package-check/config/openfallout.log
          ${{ runner.temp }}/package-check/*.log
          ~/Library/Logs/DiagnosticReports/openfallout*.ips
        if-no-files-found: ignore

    - name: Store dmg
      if: ${{ steps.classify.outputs.code != 'false' }}
      uses: actions/upload-artifact@v7
      with:
        name: openfallout-macos-dmg-arm64-${{ github.sha }}
        path: |
          ${{ github.workspace }}/build/OpenFallout-*.dmg

    # The ccache of this job holds the objects of the package build only: the unit-test tree and the Metal tree are built
    # in their own jobs, with their own caches.
    - name: Limit stored compiler cache
      if: always() && steps.compiler-cache.outcome == 'success'
      run: |
        ccache --max-size=1000M
        ccache --cleanup

    - name: Create prerelease
      if: ${{ steps.classify.outputs.code != 'false' && inputs.build-type == 'Release' }}
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ github.workspace }}/build/OpenFallout-*.dmg
          ${{ runner.temp }}/openfallout-engine-release.json
        # one line per disk image: its SHA-256 and the macOS version and chip it was checked on (check_mac_package.py --notes)
        body_path: ${{ runner.temp }}/release-notes.md
        append_body: true
        prerelease: true
        draft: true

  # The unit tests: a second build tree, unoptimized and instrumented for coverage, with only the two test suites
  # (CI/before_script.macos.sh -T). The packaged app is never instrumented. They run on the build of branches and pull
  # requests. A release tag skips them: it is made from a commit whose branch run already tested it, and a second report
  # for the same commit would be counted twice by Codecov. They no longer wait for the app: a job of their own, so a
  # packaging failure does not hide the test results and a test failure does not hold up the package.
  UnitTests:
    name: Unit tests and coverage
    if: ${{ inputs.build-type != 'Release' }}
    runs-on: macos-26
    # Time budget: cold 28.8 min, warm 3.8 min (20 Nov 2026).
    timeout-minutes: 45
    env:
      CMAKE_BUILD_TYPE: ${{ inputs.build-type }}
    steps:
    - uses: actions/checkout@v7

    # Each job decides for itself whether the change needs it, so that no Mac job waits for another job. A documentation-only
    # change skips every step after this one (CI/changed_paths.py; the job itself still reports green). It fails closed: a
    # problem in it means "build". A release tag always builds: the step is skipped there and its empty output reads as
    # "build".
    - name: Decide whether the Mac build is needed
      id: classify
      if: ${{ inputs.build-type != 'Release' }}
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: python3 CI/changed_paths.py --event "$EVENT" --base "$BASE" --github-output "$GITHUB_OUTPUT"

    - name: Set up the Mac build
      id: setup
      if: ${{ steps.classify.outputs.code != 'false' }}
      uses: ./.github/actions/mac-build-setup

    # Its own ccache: this tree is compiled with other flags than the app, so they would share no objects anyway.
    - name: Prime ccache
      id: compiler-cache
      if: ${{ steps.classify.outputs.code != 'false' }}
      uses: hendrikmuhs/ccache-action@v1.2.25
      with:
        install: 'no'
        key: macos-26-coverage
        max-size: 1000M
        # Only master and release builds store caches, so that pull request runs
        # do not push the caches pull requests start from out of the 10 GB budget.
        save: ${{ inputs.build-type == 'Release' || github.ref == 'refs/heads/master' }}

    - name: Test coverage and JUnit report collection
      if: ${{ !cancelled() && steps.classify.outputs.code != 'false' }}
      run: python3 -m unittest discover -s CI -p test_test_reports.py -v

    - name: Fingerprint unit-test build environment
      id: test-build-env
      if: ${{ !cancelled() && steps.classify.outputs.code != 'false' && steps.setup.outcome == 'success' }}
      run: |
        echo "key=$(python3 CI/build_cache.py key --compiler clang --mode 'macos-26-coverage' --dependency-file "${{ steps.setup.outputs.manifest-path }}")" >> "$GITHUB_OUTPUT"

    - name: Restore incremental unit-test build
      id: test-build-cache
      if: ${{ !cancelled() && steps.test-build-env.outcome == 'success' }}
      uses: actions/cache/restore@v6
      with:
        path: build-tests
        # Never restore ordinary build objects into an instrumented build.
        key: build-macos-coverage-v1-${{ steps.test-build-env.outputs.key }}-${{ github.sha }}
        restore-keys: build-macos-coverage-v1-${{ steps.test-build-env.outputs.key }}-

    - name: Restore unchanged source timestamps of the unit-test build
      if: ${{ !cancelled() && steps.test-build-env.outcome == 'success' }}
      run: python3 CI/build_cache.py restore --build-dir build-tests

    - name: Configure unit tests
      if: ${{ !cancelled() && steps.test-build-env.outcome == 'success' }}
      run: CI/before_script.macos.sh -C -k -T

    - name: Build unit tests
      id: test-build
      if: ${{ !cancelled() && steps.test-build-env.outcome == 'success' }}
      env:
        BUILD_DIR: build-tests
      run: CI/macos/build.sh components-tests openfallout-tests

    - name: Run components tests
      if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
      run: python3 CI/test_reports.py --build-dir build-tests run components

    - name: Run OpenFallout tests
      if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
      run: python3 CI/test_reports.py --build-dir build-tests run openfallout

    - name: Merge suite coverage reports
      if: >-
        !cancelled() && steps.classify.outputs.code != 'false' && hashFiles('coverage/components.profdata') != '' &&
        hashFiles('coverage/openfallout.profdata') != ''
      run: python3 CI/test_reports.py --build-dir build-tests merge components openfallout

    - name: Record source timestamps of the unit-test build
      if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
      run: python3 CI/build_cache.py snapshot --build-dir build-tests

    - name: Save incremental unit-test build
      if: >-
        !cancelled() && steps.test-build.outcome == 'success' &&
        steps.test-build-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master'
      uses: actions/cache/save@v6
      with:
        path: build-tests
        key: ${{ steps.test-build-cache.outputs.cache-primary-key }}

    - name: Keep coverage reports
      if: ${{ !cancelled() && steps.classify.outputs.code != 'false' && hashFiles('coverage/*.xml') != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: macos-coverage
        path: |
          coverage.xml
          coverage/*.xml
          coverage/*.profdata
        if-no-files-found: error

    - name: Keep test results
      if: ${{ !cancelled() && steps.classify.outputs.code != 'false' && hashFiles('test-results/*.xml') != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: macos-test-results
        path: test-results/*.xml
        if-no-files-found: error

    - name: Upload test results to Codecov Test Analytics
      if: >-
        !cancelled() && steps.classify.outputs.code != 'false' && hashFiles('test-results/*.junit.xml') != '' &&
        (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        report_type: test_results
        files: test-results/components.junit.xml,test-results/openfallout.junit.xml
        disable_search: true
        plugins: noop
        fail_ci_if_error: true

    - name: Upload components coverage to Codecov
      # Fork and Dependabot pull requests cannot access Actions secrets.
      if: >-
        !cancelled() && steps.classify.outputs.code != 'false' && hashFiles('coverage/components.xml') != '' &&
        (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage/components.xml
        flags: components
        disable_search: true
        plugins: noop
        fail_ci_if_error: true

    - name: Upload OpenFallout coverage to Codecov
      if: >-
        !cancelled() && steps.classify.outputs.code != 'false' && hashFiles('coverage/openfallout.xml') != '' &&
        (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage/openfallout.xml
        flags: openfallout
        disable_search: true
        plugins: noop
        fail_ci_if_error: true

    - name: Upload combined coverage to Codecov
      # Separate XML reports cannot describe complementary branches across suites.
      # Keep this report unflagged so it does not inflate the individual flags.
      if: >-
        !cancelled() && steps.classify.outputs.code != 'false' && hashFiles('coverage.xml') != '' &&
        (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        disable_search: true
        plugins: noop
        fail_ci_if_error: true

    # The ccache of this job holds the objects of the unit-test tree only.
    - name: Limit stored compiler cache
      if: always() && steps.compiler-cache.outcome == 'success'
      run: |
        ccache --max-size=1000M
        ccache --cleanup

  # The Metal build (spec "Mac Native", milestone two; docs/openfallout/osg-gles3.md) is a second build configuration
  # beside the OpenGL one until it passes its checks: the engine and the two unit-test suites against ANGLE and an
  # OpenSceneGraph built for OpenGL ES 3 (Debug, no coverage, never packaged, never part of a release). It is a job of its
  # own, so that a Metal failure fails its own check but never hides or delays the packaged app, and a release tag run
  # (release.yml, build-type Release) never builds it, so nothing in it can touch a release. The ANGLE asset must exist:
  # the release named in CI/macos/angle/angle.json has to be published before this job can pass.
  # Nothing here is cached except the small OpenSceneGraph install and the compiler cache: the build folder is not
  # (docs/openfallout/ci-cache.md).
  Metal:
    name: Metal build
    if: ${{ inputs.build-type != 'Release' }}
    runs-on: macos-26
    # Time budget: cold 20.9 min plus 6.6 min when OpenSceneGraph for GLES3 is rebuilt, warm 4.6 min (20 Nov 2026).
    timeout-minutes: 40
    env:
      CMAKE_BUILD_TYPE: ${{ inputs.build-type }}
      # ANGLE (CI/angle_asset.py fetch) and OpenSceneGraph for OpenGL ES 3 (CI/macos/before_install_osg.sh) live in one
      # folder each, named here once. These are the defaults of CI/before_script.macos.sh and
      # CI/macos/before_install_osg.sh; the steps below pass them anyway.
      ANGLE_ROOT_PATH: /tmp/openfallout-angle
      OSG_GLES3_PREFIX: /tmp/openfallout-osg-gles3
    steps:
    - uses: actions/checkout@v7

    # Each job decides for itself whether the change needs it, so that no Mac job waits for another job. A documentation-only
    # change skips every step after this one (CI/changed_paths.py; the job itself still reports green). It fails closed: a
    # problem in it means "build". A release tag always builds: the step is skipped there and its empty output reads as
    # "build".
    - name: Decide whether the Mac build is needed
      id: classify
      if: ${{ inputs.build-type != 'Release' }}
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: python3 CI/changed_paths.py --event "$EVENT" --base "$BASE" --github-output "$GITHUB_OUTPUT"

    - name: Set up the Mac build
      id: setup
      if: ${{ steps.classify.outputs.code != 'false' }}
      uses: ./.github/actions/mac-build-setup

    # Its own ccache: this tree is compiled with its own flags (nearly every file with -DOPENFALLOUT_METAL), so it
    # shares no objects with the app or the unit-test tree.
    - name: Prime ccache
      id: compiler-cache
      if: ${{ steps.classify.outputs.code != 'false' }}
      uses: hendrikmuhs/ccache-action@v1.2.25
      with:
        install: 'no'
        key: macos-26-metal
        max-size: 1000M
        # Only master and release builds store caches, so that pull request runs
        # do not push the caches pull requests start from out of the 10 GB budget.
        save: ${{ inputs.build-type == 'Release' || github.ref == 'refs/heads/master' }}

    # Each step runs when the dependency set is in place and the Metal step before it worked (a failed or cancelled step
    # skips the rest).
    - name: 'Metal build: fingerprint OpenSceneGraph for OpenGL ES 3'
      id: metal-key
      if: ${{ !cancelled() && steps.classify.outputs.code != 'false' && steps.setup.outcome == 'success' }}
      run: |
        clang --version > "$RUNNER_TEMP/clang-version.txt"
        key="$(python3 CI/macos/osg/osg_gles3.py key --input CI/macos/angle/angle.json --input "${{ steps.setup.outputs.manifest-path }}" --input CI/macos/before_install_osg.sh --input "$RUNNER_TEMP/clang-version.txt")"
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - name: 'Metal build: restore OpenSceneGraph for OpenGL ES 3'
      id: metal-osg-cache
      if: ${{ !cancelled() && steps.metal-key.outcome == 'success' }}
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.OSG_GLES3_PREFIX }}
        key: macos-osg-gles3-macos-26-${{ runner.arch }}-${{ steps.metal-key.outputs.key }}

    # The folder is empty on this runner: the manual ANGLE test run of the app job fetches its own copy on its own
    # runner (CI/angle_asset.py refuses a folder that is not empty).
    - name: 'Metal build: fetch the ANGLE libraries'
      id: metal-angle
      if: ${{ !cancelled() && steps.metal-key.outcome == 'success' }}
      run: python3 CI/angle_asset.py fetch "$ANGLE_ROOT_PATH"

    # Only when the cache above missed: an input of the key changed (CI/macos/osg/, the ANGLE record, the engine's
    # OpenSceneGraph lists or the dependency manifest).
    - name: 'Metal build: build OpenSceneGraph for OpenGL ES 3'
      id: metal-osg-build
      if: ${{ !cancelled() && steps.metal-osg-cache.outputs.cache-hit != 'true' && steps.metal-angle.outcome == 'success' }}
      run: CI/macos/before_install_osg.sh

    # Saved at once, not at the end of the job: a later failure must not throw the build away. A pull request run saves
    # it too (it is 19 MB).
    - name: 'Metal build: keep OpenSceneGraph for OpenGL ES 3'
      if: ${{ !cancelled() && steps.metal-osg-build.outcome == 'success' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ env.OSG_GLES3_PREFIX }}
        key: ${{ steps.metal-osg-cache.outputs.cache-primary-key }}

    - name: 'Metal build: configure'
      id: metal-configure
      if: ${{ !cancelled() && steps.metal-angle.outcome == 'success' && (steps.metal-osg-cache.outputs.cache-hit == 'true' || steps.metal-osg-build.outcome == 'success') }}
      run: CI/before_script.macos.sh -C -k -M -a "$ANGLE_ROOT_PATH" -o "$OSG_GLES3_PREFIX"

    # The job's ccache serves this tree; its own build folder is not stored. The statistics before and after, and
    # the free disk space, are what the first runs measure.
    - name: 'Metal build: compile'
      id: metal-build
      if: ${{ !cancelled() && steps.metal-configure.outcome == 'success' }}
      env:
        BUILD_DIR: build-metal
      run: |
        ccache --show-stats
        df -h /System/Volumes/Data
        CI/macos/build.sh openfallout components-tests openfallout-tests
        ccache --show-stats
        df -h /System/Volumes/Data

    # Pass or fail only: the results of this tree are not uploaded. The same test sources already report from the
    # OpenGL unit-test tree, and a second report would count every test twice in Codecov's Test Analytics
    # (docs/openfallout/ci-reporting.md).
    - name: 'Metal build: run components tests'
      if: ${{ !cancelled() && steps.metal-build.outcome == 'success' }}
      run: build-metal/OpenFallout.app/Contents/MacOS/components-tests

    - name: 'Metal build: run OpenFallout tests'
      if: ${{ !cancelled() && steps.metal-build.outcome == 'success' }}
      run: build-metal/OpenFallout.app/Contents/MacOS/openfallout-tests

    # The stored cache holds the objects of the Metal build.
    - name: Limit stored compiler cache
      if: always() && steps.compiler-cache.outcome == 'success'
      run: |
        ccache --max-size=1000M
        ccache --cleanup

  # The Changes job (push.yml) runs every Python test on a Linux runner, where the tests that need macOS skip themselves:
  # the packaged-app check and the bundle selection (codesign, hdiutil, vtool) and the whole runs of the round runner.
  # Here they run. The two tests that need a luajit executable run in the Changes job only. None of these tests reads the
  # built app or the disk image (they build stand-ins of their own), so this job needs neither the dependency set nor
  # the app job.
  PythonMac:
    name: Python tests on macOS
    runs-on: macos-26
    # Time budget: 8.3 min (20 Nov 2026).
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    # Each job decides for itself whether the change needs it, so that no Mac job waits for another job. A documentation-only
    # change skips every step after this one (CI/changed_paths.py; the job itself still reports green). It fails closed: a
    # problem in it means "build". A release tag always builds: the step is skipped there and its empty output reads as
    # "build".
    - name: Decide whether the Mac build is needed
      id: classify
      if: ${{ inputs.build-type != 'Release' }}
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: python3 CI/changed_paths.py --event "$EVENT" --base "$BASE" --github-output "$GITHUB_OUTPUT"

    - name: Run the Python tests on macOS
      if: ${{ steps.classify.outputs.code != 'false' }}
      run: |
        python3 -m venv "$RUNNER_TEMP/script-tests"
        "$RUNNER_TEMP/script-tests/bin/pip" install lupa==2.8 pillow==12.0.0
        python3 -m unittest discover -s CI -p 'test_*.py' -v
        "$RUNNER_TEMP/script-tests/bin/python" -m unittest discover -s scripts/openfallout -p 'test_*.py' -v
