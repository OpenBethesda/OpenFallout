name: Documentation links

on:
  push:
    branches: [master]
  # A draft pull request runs nothing (see push.yml); marking it ready for review starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test documentation link checker
        run: python3 -m unittest discover -s CI -p test_documentation.py -v
      - name: Check documentation entrypoint links
        run: python3 CI/check_documentation.py
