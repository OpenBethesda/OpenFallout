name: Documentation

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - .readthedocs.yaml
      - .github/workflows/docs.yml
  # A draft pull request runs nothing (see push.yml); marking it ready for review starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - docs/**
      - .readthedocs.yaml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A Mac runner has no Docker, so the build does what docs/Dockerfile does, natively: the Python packages of
  # docs/requirements.txt in a virtual environment, and Lua 5.1, LuaRocks and LuaDocumentor in the runner's home
  # folder (docs/source/install_luadocumentor_in_docker.sh).
  HTML:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Test Lua documentation failure handling
        run: python3 -m unittest discover -s docs -p test_luadoc.py -v
      - name: Install the documentation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/docs"
          "$RUNNER_TEMP/docs/bin/pip" install -r docs/requirements.txt
          echo "$RUNNER_TEMP/docs/bin" >> "$GITHUB_PATH"
      - name: Install LuaDocumentor
        env:
          OPENFALLOUT_LUADOC_INSTALL: 1
        run: bash docs/source/install_luadocumentor_in_docker.sh
      - name: Check documentation dependencies
        run: python -m pip check
      - name: Build HTML
        run: sphinx-build -b html docs/source docs/build
