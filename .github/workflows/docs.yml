name: Documentation

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - .readthedocs.yaml
      - .github/workflows/docs.yml
  # A draft pull request runs nothing (see push.yml); marking it ready for review starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - docs/**
      - .readthedocs.yaml
      - .github/workflows/docs.yml
  # The merge queue builds the HTML for every entry: merge_group takes no path filter, and a required check that a
  # path filter skipped would stay pending and block the queue.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On a Linux runner, in the image of docs/Dockerfile (the Python packages of docs/requirements.txt, and Lua 5.1,
  # LuaRocks and LuaDocumentor from docs/source/install_luadocumentor_in_docker.sh). A documentation change does not
  # wait for a Mac runner.
  HTML:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    # Time budget: 70 s p50, 80 s p95 over 150 runs (17-18 Nov 2026).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test Lua documentation failure handling
        run: python3 -m unittest discover -s docs -p test_luadoc.py -v
      - name: Build the documentation image
        run: docker build --tag openfallout-docs docs
      - name: Check documentation dependencies
        run: docker run --rm openfallout-docs python -m pip check
      - name: Build HTML
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/openfallout" openfallout-docs \
            sphinx-build -b html /openfallout/docs/source /openfallout/docs/build
