name: Build and test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR branches are tested by pull_request; avoid rebuilding each commit twice.
# A newer commit cancels the run of a pull request, but never a run on master:
# only master runs store the caches that pull requests start from, and a cancelled
# run stores nothing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Documentation-only changes skip the Mac build.  The job fails open to a full build: a problem in it leaves "code"
  # empty, which the job below reads as "build".  It also runs every Python test of the CI scripts, the helper scripts
  # and the documentation generator, on every change, including the documentation-only ones; on a Mac runner, so that
  # the tests that need macOS (codesign, hdiutil, vtool) run instead of being skipped.
  Changes:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
    - uses: actions/checkout@v7

    # Some helper script tests run the Lua scripts with a luajit executable (they are skipped without one); the Lua
    # checks need lupa and the picture test of the round runner Pillow, which go in their own virtual environment.
    - name: Install the tools of the script tests
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: |
        brew install luajit
        luajit -v
        python3 -m venv "$RUNNER_TEMP/script-tests"
        "$RUNNER_TEMP/script-tests/bin/pip" install lupa==2.8 pillow==12.0.0

    - name: Test the CI scripts
      run: python3 -m unittest discover -s CI -p 'test_*.py' -v

    - name: Test the helper scripts and the Lua scripts they read
      run: >
        "$RUNNER_TEMP/script-tests/bin/python" -m unittest discover
        -s scripts/openfallout -p 'test_*.py' -v

    - name: Test the Lua documentation generator
      run: python3 -m unittest discover -s docs -p test_luadoc.py -v

    - name: Decide whether the Mac build is needed
      id: classify
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: python3 CI/changed_paths.py --event "$EVENT" --base "$BASE" --github-output "$GITHUB_OUTPUT"

  # The one job that builds the engine: the packaged app, its checks, the unit tests and coverage (macos.yml). Its check
  # name, "macOS / Build, test and package", is fixed here and in macos.yml; CI/harness_release.py and the documentation
  # name it.
  MacOS:
    name: macOS
    needs: Changes
    if: ${{ !cancelled() && needs.Changes.outputs.code != 'false' }}
    uses: ./.github/workflows/macos.yml
    with:
      signing-environment: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'macos-release' || '' }}
    secrets:
      MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
      MACOS_NOTARY_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
      MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
      MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
