name: Build and test

on:
  push:
    branches:
      - master
  # A draft pull request runs nothing: its pushes used to start Mac runs that the next push cancelled. Marking it ready
  # for review starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue: every pull request runs the whole workflow again on top of the current master before it lands
  # (CI/changed_paths.py builds everything for this event, so nothing in the queue is skipped by path).
  merge_group:
  workflow_dispatch:
    inputs:
      bundle-angle:
        description: >-
          The early notarized test of ANGLE (docs/openfallout/angle.md): put the published ANGLE libraries and the ANGLE
          probe into the OpenGL app. On the default branch the image is signed and notarized. Never for a release.
        type: boolean
        default: false

permissions:
  contents: read

# PR branches are tested by pull_request; avoid rebuilding each commit twice.
# A newer commit cancels the run of a pull request, but never a run on master:
# only master runs store the caches that pull requests start from, and a cancelled
# run stores nothing.
concurrency:
  # The manual ANGLE test run has a group of its own: a pending run replaces the pending run of its group, and the
  # test run must never take the place of a push's run on master.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.bundle-angle && '-angle' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Documentation-only changes skip the Mac build.  The job fails open to a full build: a problem in it leaves "code"
  # empty, which the job below reads as "build".  It also runs every Python test of the CI scripts, the helper scripts
  # and the documentation generator, on every change, including the documentation-only ones.  It runs on a Linux
  # runner, so that it does not wait for a Mac runner when those are short (on 16 November 2026 the jobs of pull
  # requests waited for hours).  The tests that need macOS (codesign, hdiutil, vtool, a whole run of the round runner) skip
  # themselves here and run in the Mac job (macos.yml, "Run the Python tests on macOS").
  Changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
    - uses: actions/checkout@v7

    # Some helper script tests run the Lua scripts with a luajit executable (they are skipped without one); the Lua
    # checks need lupa and the picture test of the round runner Pillow, which go in their own virtual environment.
    - name: Install the tools of the script tests
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends luajit
        luajit -v
        python3 -m venv "$RUNNER_TEMP/script-tests"
        "$RUNNER_TEMP/script-tests/bin/pip" install lupa==2.8 pillow==12.0.0

    - name: Test the CI scripts
      run: python3 -m unittest discover -s CI -p 'test_*.py' -v

    - name: Test the helper scripts and the Lua scripts they read
      run: >
        "$RUNNER_TEMP/script-tests/bin/python" -m unittest discover
        -s scripts/openfallout -p 'test_*.py' -v

    - name: Test the Lua documentation generator
      run: python3 -m unittest discover -s docs -p test_luadoc.py -v

    - name: Decide whether the Mac build is needed
      id: classify
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: python3 CI/changed_paths.py --event "$EVENT" --base "$BASE" --github-output "$GITHUB_OUTPUT"

  # The one job that builds the engine: the packaged app, its checks, the unit tests and coverage (macos.yml). Its check
  # name, "macOS / Build, test and package", is fixed here and in macos.yml; CI/harness_release.py and the documentation
  # name it.
  MacOS:
    name: macOS
    needs: Changes
    # !cancelled() lets the build run when Changes failed (fail open), so the draft rule is repeated here.
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.Changes.outputs.code != 'false' }}
    uses: ./.github/workflows/macos.yml
    with:
      # a push to the default branch, or the manual ANGLE test run on it, signs and notarizes
      signing-environment: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bundle-angle)) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'macos-release' || '' }}
      bundle-angle: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle-angle }}
    secrets:
      MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
      MACOS_NOTARY_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
      MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
      MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
